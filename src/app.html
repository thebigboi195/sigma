const UNITS=[{"c": "C-INT", "e": "common", "n": "Introduction", "s": ["Through powerful storytelling, literature reveals the paradox that oppression designed to enforce conformity can instead intensify the desire for autonomy, yet that autonomy remains fragile under fear.", "Shaped by his opposition to twentieth-century totalitarianism, George Orwell’s dystopian novel Nineteen Eighty-Four (1949) warns that authoritarian power is most dangerous when it controls the shared standards of truth and identity.", "Orwell charts how manipulated reality first provokes private resistance, before human connection transforms isolation into temporary solidarity.", "Ultimately, coercion exploits the survival instinct, compelling individuals to privilege self-preservation over relationships and thereby destroying loyalty and belief.", "Through Winston’s focalisation, Orwell deepens our understanding of [LTQ] by exposing the conditional nature of human autonomy and endurance."]}, {"c": "C-BP1", "e": "common", "n": "Body 1 · Truth", "s": ["Paradoxically, when authoritarian power attempts to monopolise collective truth, it can intensify the individual desire to preserve independent judgement, yet independent thought alone cannot defend truth [LTQ].", "Shaped by his wartime BBC propaganda work and Stalinist historical revisionism, Orwell's setting warns that power becomes absolute when authority determines not only behaviour, but the political standards by which reality is judged.", "The Party first destroys any stable foundation for shared truth through the parallel syntax and circular logic of “Who controls the past controls the future: who controls the present controls the past.”", "This self-validating logic reveals that history becomes whatever present authority dictates, undermining the security of citizens’ worldview in the absence of community [LTQ].", "In response, Winston locates autonomy within personal reason, as his aphorism “Freedom is the freedom to say that two plus two make four” uses mathematical certainty to establish a standard beyond Party language affirming the freedom to trust one’s own judgement despite collective pressure [LTQ].", "Yet private awakening remains politically limited, as the chiasmus describing the proles, “Until they become conscious they will never rebel, and until after they have rebelled they cannot become conscious,” uses the collective “they” to show that change demands a class rising together, exposing a self-serving cycle in which oppression prevents the very collective awareness that could overthrow it.", "Despite this political limitation, Winston’s suppressed consciousness develops into explicit dissent through the repeated graphological capitalisation of “DOWN WITH BIG BROTHER,” which externalises a belief that Party orthodoxy has forced inward, transforming silent recognition into active rejection.", "Orwell thereby reveals that private consciousness can preserve the self, yet cannot challenge institutional power without connection to others."]}, {"c": "C-BP2", "e": "common", "n": "Body 2 · Connection", "s": ["Once private consciousness proves insufficient, human connection allows isolated individuals to convert personal dissent into a fragile form of shared resistance [LTQ].", "Responding to the ideological surveillance and betrayal Orwell witnessed during the Spanish Civil War, the novel presents intimacy as a threat to a regime sustained by enforced isolation.", "Julia first disrupts Winston’s emotional isolation through the blunt declarative of her secret note, “I love you,” whose directness defies enforced isolation while remaining hidden from the Party, allowing him to experience an attachment founded upon personal feeling rather than Party ideology and thereby recover an emotional identity that solitary intellectual resistance cannot sustain.", "Their relationship then develops from emotional refuge into deliberate opposition, as the militaristic metaphor that their intimacy is “a blow struck against the Party” and “a political act” transforms affection into shared agency, demonstrating that resistance becomes more powerful when private conviction is validated through another person [LTQ].", "However, their shared agency remains structurally fragile, as the symbolic glass paperweight, within which Winston imagines their lives “fixed in a sort of eternity at the heart of the crystal,” embodies the alternative world they construct beyond Party control.", "Its enclosed beauty suggests the security of their private connection, while the fragility and enclosure of glass foreshadow that a relationship severed from any broader community remains vulnerable to institutional force, a vulnerability the Party exploits when their search for the Brotherhood delivers them to O’Brien.", "Consequently, Orwell reveals that connection advances resistance beyond isolated thought, yet paradoxically, while private intimacy is too insular to endure, the pursuit of broader solidarity renders intimate resistance vulnerable to institutional exploitation."]}, {"c": "C-BP3", "e": "common", "n": "Body 3 · Survival", "s": ["Once intimate resistance is isolated, authoritarian power exploits physical fear to obliterate individuality [LTQ].", "Through the Ministry of Love’s coercive reshaping of individual identity, Orwell condemns the brutality of twentieth-century totalitarian regimes.", "Under extreme coercion, individual identity becomes malleable, as O’Brien’s disturbing metaphor, “We shall squeeze you empty, and then we shall fill you with ourselves,” reduces Winston to a vessel that can be emptied of personal convictions and refilled with Party ideology, revealing that absolute power seeks to replace rather than merely suppress individuality.", "The Party then weaponises instinct against relational loyalty, as Winston’s fragmented imperatives, “Do it to Julia! … Not me!”, expose the inconsistency between his earlier belief that emotional allegiance could resist political domination and his willingness to sacrifice Julia when confronted by overwhelming fear.", "By turning the instinct to survive against the relationship that sustained Winston’s autonomy, Orwell demonstrates that a fundamental human drive can become an instrument of self-betrayal [LTQ].", "Finally, Orwell reveals that coercion converts imposed obedience into internalised belief through the paradoxical resolution that Winston “had won the victory over himself” and “loved Big Brother.”", "The bitter irony of “victory” recasts psychological defeat as triumph, revealing that absolute power seeks not mere submission but the victim’s embrace of their own destruction [LTQ].", "This capitulation therefore exposes Orwell’s bleak limit of human endurance: once fear severs individuals from shared truth and sustaining relationships, self-preservation can erode our moral and intellectual integrity, compelling us to question whether our own convictions would survive."]}, {"c": "C-CON", "e": "common", "n": "Conclusion", "s": ["Ultimately, through Winston’s focalised descent, Nineteen Eighty-Four illuminates [LTQ] by exposing a paradox at the heart of autonomy: it depends upon the very truth and connection that power can destroy.", "Orwell leaves us confronting an uncomfortable inconsistency within ourselves, as our desire for freedom may yield to the more fundamental instinct to survive."]}, {"c": "B-INT", "e": "modb", "n": "Introduction", "s": ["T.S. Eliot's poetry interrogates humanity's search for meaning within the fragmentation of modernity, and its textual integrity lies in its experimental forms, which enact the paralysis, emptiness and costly renewal they describe, [sustaining its literary value for contemporary responders].", "Writing as industrialisation, world war and declining faith dissolved inherited certainties, Eliot fragments form to mirror a fragmented age.", "In 'The Love Song of J. Alfred Prufrock' (1915), dramatic monologue exposes an individual paralysed by social scrutiny; 'The Hollow Men' (1925) expands his isolation into collective spiritual desolation; and 'Journey of the Magi' (1927) complicates despair through the arduous possibility of religious renewal."]}, {"c": "B-BP1", "e": "modb", "n": "Body 1 · Prufrock", "s": ["In 'Prufrock', Eliot reveals that conformity and fear of judgement fracture the modern self into paralysis, a private failure that foreshadows a collective doom, [affirming a textual integrity that endures for modern audiences equally governed by others' scrutiny].", "Building on the anonymous city of 'Preludes', where people shrink to \"muddy feet\", Eliot situates Prufrock within the rigid decorum of pre-war drawing rooms, where reputation governed conduct.", "The epigraph from Dante's Inferno frames the dramatic monologue as a confession made only because its speaker believes no one will repeat it; Prufrock's 'love song' is therefore never sung, its silence enacting the paralysis Eliot exposes.", "Eliot externalises Prufrock's paralysis as the \"yellow fog that rubs its back upon the window-panes\" becomes an objective correlative for his languid inertia.", "The refrain \"In the room the women come and go / Talking of Michelangelo\" reduces high culture to ritualised chatter, its repetition enacting the social scrutiny that later fixes him \"in a formulated phrase\".", "Prufrock's life, \"measured out\" with \"coffee spoons\", reduces existence to trivial ritual, while the bathetic question \"Do I dare / Disturb the universe?\" magnifies ordinary action into existential crisis, exposing fear of judgement as the force that paralyses modern agency.", "Eliot denies the modern individual heroic agency through Prufrock's allusive self-demotion from \"Prince Hamlet\" to \"an attendant lord\" [unsettling my faith in individual agency].", "McCoy and Harlan aptly identify in Prufrock the \"frustration and impotence of the modern individual\"; however, Eliot's form suggests such impotence is socially produced, for the poem ends as human contact becomes fatal: \"Till human voices wake us, and we drown.\"", "Ironically, a promised love song dissolves into a collective 'we', foreshadowing the communal emptiness of Eliot's later verse.", "Eliot thus exposes paralysis as the product of a society prizing appearance over authentic connection."]}, {"c": "B-BP2", "e": "modb", "n": "Body 2 · The Hollow Men", "s": ["Extending private paralysis into collective spiritual emptiness, 'The Hollow Men' depicts a post-war civilisation that retains the rituals and language of faith while losing the spiritual conviction to act upon them, [deepening my understanding of desolation as spiritual rather than personal].", "Written amid the disillusionment following World War I, the poem opens with the epigraph \"Mistah Kurtz—he dead\", alluding to Conrad's Heart of Darkness to frame modernity as morally hollow.", "Eliot dehumanises post-war society through the paradox \"We are the hollow men / We are the stuffed men\", which presents individuals as spiritual vessels emptied of faith yet stuffed with hollow ritual.", "Eliot then fractures structure itself: the refrain \"Between the idea / And the reality ... Falls the Shadow\" isolates each abstraction on its own line, so the Shadow falls between intention and act, and the broken Lord's Prayer, \"For Thine is / Life is / For Thine is the\", collapses before completion.", "Helen Gardner defines religious poetry as \"concerned in some way with revelation and with man's response to it\"; 'The Hollow Men' is religious in precisely this negative sense, depicting a civilisation that remembers revelation but cannot complete its response [LTQ].", "This complicates I.A. Richards' contemporaneous claim that Eliot had severed his poetry from \"all beliefs\": the fractured prayer registers not the absence of belief, but a failed reaching towards it.", "Ultimately, the anticlimactic \"This is the way the world ends / Not with a bang but a whimper\" suggests that meaning erodes rather than explodes.", "Fittingly, fragmented free verse embodies the dissolution of meaning it condemns, a fusion of form and concept that constitutes its textual integrity, allowing its spiritual crisis to transcend its post-war context and speak to a secular age that inherits faith's language without its conviction.", "Eliot therefore presents spiritual emptiness as a collective condition, demanding the costly renewal his later poetry explores."]}, {"c": "B-BP3", "e": "modb", "n": "Body 3 · Journey of the Magi", "s": ["Yet 'Journey of the Magi' redirects this emptiness towards fulfilment through faith, while revealing that transformation demands suffering and the abandonment of former certainty, [complicating my understanding of renewal].", "Published months after Eliot's 1927 baptism into the Church of England, the poem appropriates Lancelot Andrewes' 1622 Nativity sermon in its opening, \"A cold coming we had of it\", stripping the Nativity of conventional warmth.", "The ominous \"three trees on the low sky\" and \"Six hands at an open door dicing for pieces of silver\" embed the Crucifixion and Judas' betrayal within the Nativity journey, collapsing beginning into ending.", "The Magus' syntax falters as he struggles to articulate revelation, \"set down / This set down / This\", before the paradox that \"this Birth was / Hard and bitter agony for us, like Death, our death\" reveals that rebirth demands the death of the former self [LTQ].", "Russell Elliott Murphy likens the Magus to the hollow men: having glimpsed the light, he \"is unable to either recognize its source or to follow it.\"", "I find Murphy's reading too closed, however: the Magus' insistence that \"I would do it again\" and his closing wish to \"be glad of another death\" suggest not incomprehension but a longing to complete the transformation begun, since he is \"no longer at ease here, in the old dispensation\".", "Eliot therefore offers faith as a genuine source of meaning, yet one attained only through estrangement and loss, unsettling contemporary expectations of instant, comfortable fulfilment."]}, {"c": "B-CON", "e": "modb", "n": "Conclusion", "s": ["Ultimately, Eliot's textual integrity lies in making fragments of both subject and method [LTQ].", "Because his poetry refuses to resolve the struggle between emptiness and meaning, we recognise our own uncertain search within it, ensuring its enduring value for contemporary responders."]}, {"c": "A-INT", "e": "moda", "n": "Introduction", "s": ["Textual conversations create new meaning about (LTQ) when later composers preserve enduring concerns while testing the assumptions and values that originally shaped them.", "Margaret Atwood’s postmodern novel Hag-Seed (2016), written for the Hogarth Shakespeare project, reimagines William Shakespeare’s Jacobean tragicomedy The Tempest (1611), translating its concerns with art, forgiveness and power into a prison-theatre setting shaped by rehabilitation, psychological freedom and marginalised agency.", "Notably, Atwood mirrors Shakespeare’s use of theatre as a dialogue between creator and audience while sharing interpretive authority among director, performers and audience; aligns with his movement from vengeance towards liberating release while internalising redemption through Felix’s grief; and collides with Shakespeare’s containment of Caliban’s resistance within hierarchy by amplifying the voices of those traditionally marginalised.", "Through these resonances and dissonances, Atwood reveals that revisiting a familiar text tests inherited assumptions about authority, liberation and agency, renewing (LTQ) for contemporary audiences."]}, {"c": "A-BP1", "e": "moda", "n": "Body 1 · Mirror: theatre", "s": ["Atwood’s Hag-Seed instigates a resonant textual conversation with The Tempest by mirroring Shakespeare’s representation of theatre as transformative, yet distributes interpretive authority among director, performers and audience, enhancing our contemporary appreciation of art as a shared process of interpretation.", "Within Jacobean drama’s self-conscious theatrical conventions, Shakespeare foregrounds the constructed nature of performance through Prospero’s declaration that “Our revels now are ended” and his actors “are melted into air,” where metatheatrical self-reference dissolves the boundary between Prospero’s spectacle and the stage itself, inviting audiences to question the permanence of the roles and realities before them.", "Shakespeare then makes the exchange explicitly reciprocal through Prospero’s Epilogue, “Let your indulgence set me free,” where direct audience address makes Prospero’s release dependent upon the responder, revealing that theatrical meaning cannot be controlled by its creator alone (LTQ).", "In Atwood’s prison theatre, she preserves Shakespeare’s participatory power when Felix instructs the inmates to “shed your daily self” and “draw on a new face”, where the extended metaphor of reconstructing identity transforms performance into rehabilitation, allowing prisoners to create identities beyond institutional labels.", "Atwood extends Shakespeare’s reciprocal relationship between creator and audience through the observation that “the brain completes the illusion,” using metatheatrical commentary to make meaning dependent upon performers and responders, demonstrating that textual conversation can redistribute the creative authority already implicit in Shakespeare’s theatre.", "By democratising Shakespeare’s metatheatre, the textual conversation invites contemporary audiences to value art as a collaborative act that transforms both creator and responder, renewing the significance of (LTQ)."]}, {"c": "A-BP2", "e": "moda", "n": "Body 2 · Align: release", "s": ["Aligning with Shakespeare’s movement beyond vengeance towards release, Atwood’s Hag-Seed transforms Shakespeare’s public moral restoration into a more intimate psychological recovery from grief, a textual conversation that reshapes our contemporary understanding of forgiveness.", "Within Shakespeare’s Christian-humanist context, where virtuous self-command supports moral and social restoration, Prospero privileges ethical restraint when he recognises that “the rarer action is / In virtue than in vengeance,” as the antithesis between “virtue” and “vengeance” elevates self-command over retaliation, linking personal forgiveness to restored communal order.", "Shakespeare then externalises the renunciation when Prospero vows, “I’ll break my staff,” symbolically renouncing the instrument of manipulation and relinquishing the authority sustaining his revenge.", "Whilst Atwood concurs with Shakespeare’s belief that liberation requires surrendering destructive control, her contemporary emphasis on rehabilitation and psychological grief shifts release from social restoration towards internal recovery (LTQ).", "Atwood initially aligns Felix with Prospero’s rejection of vengeance while redirecting its consequences inward when he determines, “That’s enough vengeance.", "Not a frown further,” as the truncated declaratives echo Prospero’s restraint yet recast revenge from the coercive control of others into Felix’s self-destructive fixation.", "Atwood further internalises Shakespeare’s conception of release through Felix’s recognition that he has been “keeping her tethered” before telling Miranda, “To the elements be free,” where the metaphor of restraint and intertextual echo of Ariel’s liberation transform Shakespeare’s external surrender of power into Felix’s acceptance of grief.", "The conversation therefore persuades contemporary audiences that (LTQ) depends upon release, extending it from the surrender of coercive authority to the acceptance of loss."]}, {"c": "A-BP3", "e": "moda", "n": "Body 3 · Collide: marginalised voices", "s": ["In a dissonant textual conversation, Atwood’s Hag-Seed collides with Shakespeare’s containment of colonised resistance within colonial hierarchy, amplifying a protest the play already voices into collective agency capable of redefining identity and freedom.", "Shakespeare challenges Prospero’s claim to legitimate ownership when Caliban declares, “This island’s mine, by Sycorax my mother,” as the possessive declarative and appeal to maternal lineage establish an alternative claim to authority; however, within a Jacobean culture shaped by inherited hierarchy and early colonial encounters, Caliban’s challenge remains contained by Prospero’s rule.", "Shakespeare further exposes the contradiction within supposedly civilising authority when Caliban protests, “You taught me language, and my profit on’t / Is, I know how to curse,” where bitter irony converts Prospero’s imposed language into resistance, allowing Caliban to voice his subordination without escaping it.", "While Shakespeare therefore permits Caliban to contest authority without escaping its structures, Atwood’s twenty-first-century context, shaped by heightened attention to postcolonial identity and institutional marginalisation, enables her to contradict this containment by granting the prisoners collective authorship over Caliban’s identity.", "Atwood then empowers the prisoners to reclaim imposed marginality through the rap, “Hag-Seed’s black and Hag-Seed’s brown, / Hag-Seed’s red,” where anaphora and cumulative racial identification transform Shakespeare’s isolated outcast into communal solidarity, allowing marginalised performers to redefine imposed labels.", "Atwood further amplifies their agency when the prisoners refuse to “get on the back of the bus” and demand “our land right back”, as the historical allusions to racial segregation and dispossession connect Caliban’s subjugation with contemporary concerns surrounding race, incarceration and social exclusion (LTQ).", "Atwood therefore does not merely reskin Shakespeare’s conflict; she expands possibilities embedded within marginalised resistance, even as the rap still sounds within Felix’s production, compelling contemporary audiences to reconsider who may speak, define identity and challenge inherited authority."]}, {"c": "A-CON", "e": "moda", "n": "Conclusion", "s": ["Ultimately, the textual conversation between The Tempest and Hag-Seed reveals that inherited stories stay alive as each generation questions them.", "Reading Shakespeare through Atwood, we hear tensions his play already voices with renewed prominence and contemporary urgency, enriching our understanding of (LTQ) through reinterpretation rather than repetition."]}, {"c": "M-1", "e": "modc", "n": "Name Sign · Part I (to “He thought I had given him something.”)", "s": ["My brother’s name is Daniel, and I am the one who decided what he would be called.", "He was six, and I was ten, and he had been deaf since he was two.", "At school he sat in the support room with Minh, who had arrived from Vietnam that winter without a word of English.", "Sharing no language at all, they drew each other pictures all day—they were the happiest boys in the building.", "In Auslan you are given a name sign, usually about something true — a habit, a scar, the way you laugh.", "If you look away you have not merely stopped talking; you have made the other person disappear.", "Proper name signs come from Deaf people.", "Ours was a hearing house, and nobody had told us that.", "Daniel breathed through his mouth when a thing was hard.", "His jaw would go loose, and for about four seconds he looked, and this is the word I used, stupid.", "I am not going to put a kinder one in its place and call it honesty.", "So I made him a sign.", "Two fingers at my own mouth, opening.", "I did it outside the shops, Minh beside us, for Michael Petrakis, who pretended not to understand his yiayia’s Greek in front of us, and he laughed so hard he sat down on the gutter.", "And Daniel, who had been watching my hands — because that is the only door in — copied it back to me.", "Minh did not laugh.", "He had no English for the joke, so he read it the only way left to him, off Michael’s face and then off mine.", "He thought I had given him something."]}, {"c": "M-2", "e": "modc", "n": "Name Sign · Part I (the hallway)", "s": ["My mother saw it from the car.", "She said it that night in the hallway, in Arabic, which she kept for things that were not to leave the house, the door open behind her so I could see him at his reading, breathing through his mouth.", "“Tell him what it means,” she said.", "“He likes it,” I said.", "She did not answer.", "She pushed the door wider, so the lamp fell across his page, and waited.", "I had just learned that you can do in one second what takes a year to undo, and I did not have the words, not in English, not in Arabic, not in the forty signs I knew.", "Underneath that was the real reason: I did not want to.", "I did not tell him.", "For the rest of that year, I became very good at watching my brother’s hands and not his eyes."]}, {"c": "M-3", "e": "modc", "n": "Name Sign · Part II · Now", "s": ["Daniel is thirty-two, with two hearing daughters both faster in Auslan than I will ever be.", "Last month he taught his older girl’s kindergarten class some signs, and I went to hold the door.", "He stood before twenty-six five-year-olds on the carpet, children who went home to Mandarin and Arabic and Samoan and Hindi, and he gave them a language none of them had brought from home, and so one they could all learn together.", "He introduced himself: two fingers at his mouth, opening.", "Twenty-six children gave it back, delighted.", "The first was a girl at the back who, her teacher said, had not yet spoken a word of English.", "She watched his face the whole time, the way Minh used to.", "In the car park, I told him.", "All of it, badly, my hands shaking so much he asked me twice to slow down.", "He had known since he was fifteen, when a boy at the Deaf school asked who had given him that, and pulled a face.", "“Why did you keep it?”", "I signed.", "“It stopped being about my mouth a long time ago,” he signed back.", "“Now it just means me.”", "He made it once more with one hand, not watching, the way you sign your name on a form.", "I had wanted, for twenty-six years, to be forgiven for four seconds outside a shopping centre.", "What I was given instead was a fact about language.", "Then he said it aloud, which he rarely does: “It’s alright, Pete.”", "It is not alright.", "But it is his, and he has decided, and that is not the same as forgiveness.", "The car park filled with parents calling their children in every language but mine, and I did the one thing I had spent my whole childhood not doing.", "I looked at his face."]}, {"c": "M-R", "e": "modc", "n": "Reflection", "s": ["In my imaginative piece Name Sign, I aimed to convey [LTQ] by exploring how a moment of childhood cruelty outlives the child who committed it.", "Drawing on Gwen Harwood's 'Father and Child', I adopted her diptych structure to delay the reckoning and made her motifs of sight and naming literal in a multilingual, signed world.", "Central to my piece, I reimagined the withheld moral reckoning of Harwood's 'Barn Owl' and 'Nightfall' by utilising a dated diptych to convey [LTQ].", "Where 'Barn Owl' confronts the cruelty at once, leaving the child “owl blind in early sun / for what I had begun”, 'Nightfall' revisits it across “Forty years, lived or dreamed”.", "I adapted this return across time to a delayed confession: I dated my panels ‘I. 1999’ and ‘II.", "Now’, and made “I did not tell him” Part I’s culminating refusal, which the motif of hands, not eyes, carries into Part II.", "Her father's “End what you have begun” becomes my mother's “Tell him what it means”, issued in Arabic, disobeyed, and pressed through silent action rather than repetition.", "Because structure rather than narration does the moral work, my reader reaches the judgement first.", "Inspired by Harwood's twin motifs, I used motif and symbolism to make sight and naming literal.", "Where Harwood's guilt arrives through eyes that “did not see / mirror my cruelty”, my narrator’s metaphor states it plainly: “If you look away … you have made the other person disappear.”", "My narrator's year of “watching my brother's hands and not his eyes” is reversed only in the closing short sentence, “I looked at his face.”", "Minh, with “no English for the joke”, and the silent kindergarten girl show that sight carries meaning where speech cannot, while parents calling “in every language but mine” leave my narrator outside a world that has already accepted Daniel.", "Harwood's consolation that “things truly named / can never vanish from earth” is complicated: Daniel's “Now it just means me” is a fact about language, not forgiveness, inviting my reader to reconsider [LTQ]."]}];

// ---------- stats
function eff(P){
  const s = Object.assign({}, P.st); if ((P.boons||[]).includes('trained')) for (const k of ['STR','AGI','FOR','WPN']) s[k] += 2; const tr = (P.eq.trinkets||[]).filter(Boolean);
  for (const t of tr) if (['STR','AGI','WPN'].includes(t.eff)) s[t.eff] += t.v;
  return s;
}
function abilOf(it, id){ if (!it) return 0; let v = 0; for (const [a,x] of (it.abil||[])) if (a===id) v += x; if (it.down && it.down[0]===id) v += it.down[1]; return v; }

function derive(P){
  const s = eff(P), w = P.eq.weapon, a = P.eq.armour;
  let max = (K.hpBase + K.hpPer*s.FOR + (a?a.hp:0)) * (1 + trink(P,'HPPCT')/100 + ((P.boons||[]).includes('bulk')?0.1:0) - ((P.boons||[]).includes('berserk')?0.1:0)) * Math.max(0.3, 1 - (abilOf(w,'maxhp') + abilOf(a,'maxhp'))/100);
  let dodge = Math.min(0.10, K.agiDodge*s.AGI) + (abilOf(a,'evasion'))/100 + ((P.boons||[]).includes('dance')?0.08:0) - (abilOf(w,'clumsy') + abilOf(a,'clumsy'))/100;
  const surplus = Math.max(0, s.WPN - (w.req.WPN||0));
  return {s, max: Math.round(max), dodge: clamp(dodge, 0, K.dodgeCap), mult: (1 + K.strPer*s.STR) * (1 + K.wpnSurplus*Math.min(surplus, 30)),
          crit: 0.05 + K.agiCrit*s.AGI + abilOf(w,'crit')/100, speed: 10 + 0.25*s.AGI};
}
function canEquip(P, it){ if (!it.req) return true; const s = eff(P); return Object.entries(it.req).every(([k,v]) => s[k] >= v); }

function power(it){ if (!it) return 0;
  if (it.kind==='weapon') return it.dmg * (1 + 0.12*(it.abil||[]).length) * (it.down?0.93:1);
  if (it.kind==='armour') return it.hp * (1 + 0.12*(it.abil||[]).length);
  return 50 + it.rar*20; }

// ---------- loot
// Legendary / Mythical odds were cut hard in v7 (the really good gear now lives in the ★7 and ★10 dungeons)
const RARW = [[63,28,8,0.9,0],[63,28,8,0.9,0],[61,29,9,0.9,0],[58,30,11,1.4,0],[44,33,20,3.5,0.3],[33,34,26,6.5,1.0],[22,34,32,10,2]];
/* a Promised (5) or Outerversal (6) piece, chosen from the whole roster whatever the land */

const tome = n => ({uid:UID++, kind:'tome', name:'Tome of Wisdom', wis:n});
function rollChest(r, w, stars, kind, extra=0, lucky=false){

// ---------- paths
// chance per level that the map offers a ★5 / ★6 path, rising with depth (level 5: ~6% / ~1%, level 40: ~25% / ~7%)
function starOdds(L){ const lv = WEB ? L : 1 + 49*(L-1)/(Math.max(2, LMAX)-1); const x = Math.min(1, Math.max(0, (lv-1)/49));
  return {lv, p5: Math.min(0.32, 0.03 + 0.0055*lv), p6: Math.min(0.10, 0.004 + 0.0016*lv), p7: L < 12 ? 0 : Math.min(0.13, 0.010 + 0.0034*L), p10: L < 18 ? 0 : Math.min(0.028, 0.0006 + 0.0006*L), w:[0, 7 - 4*x, 40 - 18*x, 38 - 6*x, 12 + 10*x]}; }
function rollPaths(r, L, w){ if (w != null) curW = w;
  const ml = miniLv(); const W = WORLDS[curW] || WORLDS[0]; if (ml.includes(L)) return [{stars:5, kind:'mini', theme:L===ml[0]?2:3, idx:L===ml[0]?0:1, key: pick(W.mini, r)}];
  if (isBossL(L)) return [{stars: L === LMAX ? 10 : 4, kind:'boss', theme: L === LMAX ? 6 : 4, key: pick(W.bossKeys || [W.bossKey], r), final: L === LMAX}];
  const out = []; const n = 3; const od = starOdds(L);
  for (let i=0;i<n;i++){
    if (i===n-1 && r() < 0.3){ out.push({stars:1, kind:'event', ev: pick(['river','campsite','altar','aura','shrine','merchant'], r), theme: Math.floor(r()*4)}); continue; }
    const st = wpick(od.w, r); out.push({stars:st, kind:'normal', theme: Math.floor(r()*4)}); }
  // rarer, harder dungeons turn up more often the deeper you go (but never impossible early)
  const slots = () => out.map((p, i) => p.kind === 'normal' ? i : -1).filter(i => i >= 0);
  if (r() < od.p5){ const sl = slots(); if (sl.length) out[pick(sl, r)] = {stars:5, kind:'normal', theme:4}; }
  if (r() < od.p6 && W.gods){ const sl = slots().filter(i => out[i].stars < 5); if (sl.length) out[pick(sl, r)] = {stars:6, kind:'god', theme:4, key: pick(W.gods, r)}; }
  if (r() < od.p7){ const sl = slots(); if (sl.length){ const di = Math.floor(r()*D.PROMISED_DUOS.length); out[pick(sl, r)] = {stars:7, kind:'promised', theme:5, key:di}; } }
  if (r() < od.p10){ const sl = slots(); if (sl.length) out[pick(sl, r)] = {stars:10, kind:'outer', theme:6, key: pick(D.OUTER_BOSSES, r)}; }
  return out.sort((a,b)=>(a.kind==='event')-(b.kind==='event') || a.stars-b.stars);

// ---------- enemies
let EXP = null; // filled by calibration table below
/* ---------- levels: the hero levels from study XP; enemies have a level from where they stand (world + round) ---------- */
const XPK = {perLevel:100, perQuest:25, kill:[0,8,15,22,32,44,60], mini:45, boss:60, god:85, promised:140, outer:260, final:320, gapPen:0.12, catchUp:0.3, sp:3};
const lvPerStage = () => WEB ? 1 : 29/(Math.max(2, LMAX)-1);
const enemyLv = (w, L) => plOf(w, L);
function avgPts(L){ const ws = tierWeights(L); let a = 0, b = 0; for (let t=1;t<ws.length;t++){ a += ws[t]*TIERS[t].pts; b += ws[t]; } return b ? a/b : 2; }

function questXP(pts, L, gap){ return XPK.perQuest * pts / avgPts(L) * lvPerStage() * gapMod(gap); }
// XP for winning a fight: harder dungeons (more stars), mini-bosses and bosses pay more
function killXP(stars, kind, gap){ const base = kind === 'final' ? XPK.final : kind === 'outer' ? XPK.outer : kind === 'promised' ? XPK.promised : kind === 'god' ? XPK.god : kind === 'boss' ? XPK.boss : kind === 'mini' ? XPK.mini : XPK.kill[Math.max(0, Math.min(6, stars||0))]; return base * lvPerStage() * gapMod(gap) * (NQ ? K.nqXP : 1); }
/* the "reference hero" at level E: stats from level-ups, half Common / half Rare gear at its level */
const REF = {};
function refP(E){ E = Math.max(1, Math.round(E)); if (REF[E]) return REF[E]; const tot = XPK.sp*(E-1); const want = {STR:0.36, FOR:0.34, AGI:0.15, WPN:0.15}; const st = {STR:0, AGI:0, FOR:0, WPN:0};
  for (let i=0;i<tot;i++){ let k='STR', g=-1e9; const sum = st.STR+st.AGI+st.FOR+st.WPN; for (const x in want){ const gg = want[x]*(sum+1) - st[x]; if (gg > g){ g = gg; k = x; } } st[k]++; }
  const wpn = applyLevel({kind:'weapon', arch:'blade', rar:0, ti:1, abil:[]}, E); wpn.dmg = wpn.dmg*1.1; const arm = {kind:'armour', role:'robe', rar:0, abil:[], hp: ABf(E)*1.1, req:{}};
  const d = derive({st, boons:[], eq:{weapon:wpn, armour:arm, trinkets:[]}}); return (REF[E] = {dps: wpn.dmg*d.mult*1.35, hp: d.max, st}); }
const ramp = E => E >= 10 ? 1 : 0.6 + 0.4*(E-1)/9;   // the first few levels ease in while the hero finds real gear
// within a world, foes grow a little tougher to match the loot a hero usually gathers (mini-boss Legendaries etc.)
const inWorld = L => WEB ? K.webLo + (K.webHi - K.webLo)*Math.pow(Math.min(1, (L-1)/49), K.webPow) : K.wlo + (K.whi - K.wlo)*(L-1)/(Math.max(2, LMAX)-1);
function budget(w, L){ const E = enemyLv(w, L); const r = refP(E); const m = (WEB ? K.webm : K.wm[w])*ramp(E)*inWorld(L)*(NQ ? K.nqHard : 1); return {dps: r.dps*m, hp: r.hp*m}; }
function makeEnemy(key, hp, atk, opts={}){
  const [name, art, color, trait] = ENEMIES[key];
  return {id:UID++, key, name: (opts.elite?'Elite ':'') + name, art, color, trait, boss:trait==='boss', elite:!!opts.elite, hp:Math.round(hp), max:Math.round(hp), atk:Math.max(2, Math.round(atk)),
          status:{burn:0, burnDmg:0, stun:0}, charging:false, guard:false, enraged:false};
}
function makeGroup(w, L, path, r){ const g = makeGroup0(w, L, path, r); const E = enemyLv(w, L); g.forEach(e => e.lv = E);
  if (WEB && path.kind === 'boss' && L === LMAX){ const b = g.find(e => e.boss && !e.minion); if (b) b.final = true; }   // the final boss is built at ★10 strength in makeGroup0
  if (!WEB && path.kind === 'boss' && L === LMAX && w === 3){ const b = g.find(e => e.boss && !e.minion); if (b) b.final = true; }
  return g; }
const kitMoves = key => D.BOSSKIT && D.BOSSKIT[key] ? D.BOSSKIT[key].moves.map(m => Object.assign({}, m)) : null;
function makeBoss(key, hp, atk, o){ const e = makeEnemy(key, hp, atk, o); const k = D.BOSSKIT && D.BOSSKIT[key]; if (k){ e.moves = kitMoves(key); e.kit = key; } return e; }
function makeHealer(key, boss){ const e = makeEnemy(key, boss.max*K.healerHp, boss.atk*0.25); e.minion = true; e.healer = true; e.moves = D.HEALERKIT.moves.map(m => Object.assign({}, m)); e.name = D.HEALER_NAMES[key] || e.name; return e; }
const FINAL_HEALER = ['healVoid','healDeep','healEmber','healStar'];
function makeGroup0(w, L, path, r){
  const b = budget(w, L), W = WORLDS[w];
  if (path.kind==='promised'){ const duo = D.PROMISED_DUOS[path.key] || D.PROMISED_DUOS[0];
    const out = duo.keys.map(k => { const kit = D.BOSSKIT[k] || {}; const e = makeBoss(k, b.dps*K.ttk*K.p7.hp*(kit.hp||1), b.hp/K.ttd*K.p7.atk*(kit.atk||1)); e.promised = true; return e; }); out.forEach((e, i) => { e.duo = i; }); return out; }

/* per-frame idle animation for weapons and auras (called by the renderer) */
function animate(g, t, dt){
  const u = g.userData; if (!u.parts) return; if (u.anims) ASM.tick(u.anims, t, dt);
  const wps = [u.parts.wpn, u.parts.wpnL].filter(Boolean);
  for (const w of wps){ const d = w.userData; if (d.anims) ASM.tick(d.anims, t, dt);
    if (d.sparkles) d.sparkles.forEach((s, i) => { const k = (t*0.6 + s.userData.ph) % 1; s.position.set(Math.sin(t*2 + i)*0.25, s.userData.y + Math.sin(t + i)*0.2, Math.cos(t*2 + i)*0.25); s.material.opacity = Math.sin(k*Math.PI); });
    if (d.shards) d.shards.forEach((s, i) => { const a = t*2.4 + i*2.09; s.position.set(Math.cos(a)*0.55, d.tipY*0.55 + Math.sin(t*1.7 + i)*0.4, Math.sin(a)*0.55); s.rotation.x += dt*3; s.rotation.y += dt*2; });
    if (d.light) d.light.intensity = (d.shards ? 1.4 : 0.9) + Math.sin(t*4)*0.35;
    if (d.glow) d.glow.material.opacity = 0.7 + Math.sin(t*3)*0.3;
    if (d.flail) d.flail.position.x = Math.sin(t*2.2)*0.12;
    if (d.runes) d.runes.forEach((r, i) => { const a = t*1.2 + i*1.26; r.position.x = Math.cos(a)*0.4; r.position.z = Math.sin(a)*0.4; r.rotation.y = -a; });
    if (d.spinDisc) w.rotation.y += dt*1.5;
    if (d.flames) d.flames.forEach((s, i) => { const kk = (t*0.9 + s.userData.ph) % 1; const b = s.userData.base; s.position.set(b[0] + Math.sin(t*3+i)*0.08, b[1] + kk*0.9, b[2]); s.material.opacity = Math.sin(kk*Math.PI); });
  }
  if (u.orbs) u.orbs.forEach((o, i) => { const a = t*1.6 + i*(Math.PI*2/u.orbs.length); o.position.set(Math.cos(a)*2.2, 3 + Math.sin(a*1.3)*1.2, Math.sin(a)*2.2); });
  if (u.embers) u.embers.forEach((e, i) => { const k = (t*0.35 + e.userData.ph) % 1; e.position.set(Math.sin(i*1.7 + t)*1.4, 0.5 + k*7, Math.cos(i*2.3)*0.9); e.material.opacity = Math.sin(k*Math.PI); });
  if (u.aura) u.aura.material.opacity = 0.75 + Math.sin(t*2)*0.25;
  if (u.halo) u.halo.rotation.z += dt;
  if (u.wings) u.wings.forEach((w, i) => w.rotation.y = (i ? -1 : 1)*(0.25 + Math.sin(t*2.2)*0.18));
  if (u.tail) u.tail.rotation.y = Math.sin(t*1.6)*0.35;
  if (u.tails9) u.tails9.forEach((t2, i) => t2.rotation.z = (i-4)*0.32 + Math.sin(t*2 + i)*0.08);
  if (u.drums) u.drums.rotation.z += dt*0.4;
  if (u.sunRing) u.sunRing.rotation.z -= dt*0.3;
  if (u.swordHalo) u.swordHalo.rotation.z += dt*0.6;
  if (u.scarfTail) u.scarfTail.rotation.y = Math.sin(t*3)*0.3;

  const desc = pth => pth.kind==='god' ? `<b>${esc(Dd.ENEMIES[pth.key][0])}</b>: a myth god (${esc(Dd.GOD_TEXT[pth.key]||'')}). Brutal. Win for a guaranteed Mythical weapon or armour` : pth.kind==='boss' ? `World boss: ${esc(pth.key ? Dd.ENEMIES[pth.key][0] : WD[S.world].boss)}` : pth.kind==='mini' ? `Mini-boss: ${esc(pth.key ? Dd.ENEMIES[pth.key][0] : '')}. Always an Epic, 25% a Legendary, 1.5% a Mythical` : pth.kind==='event' ? `<b>${esc(Dd.EVENTS[pth.ev].n)}</b>: no fight, a choice` :
    ['', 'Lucky path: 3 bonus quests (more points), weak foes, a chest', 'A fair fight', 'Tougher foes, better chest', 'Elite enemy, rich chest', 'Deadly. Win for a guaranteed Legendary (maybe Mythical)'][pth.stars];
  const dm = S.dailyMsg ? `<p class="ok">${esc(S.dailyMsg)}</p>` : ''; S.dailyMsg = null;
  p.innerHTML = dm + `<h2>Level ${S.level}: choose your path</h2><p class="muted">Enemies here are <b>Lv ${foeLv()}</b>. You are <b>Hero Lv ${heroPL()}</b>${heroPL() >= foeLv()+2 ? ' (ahead: good odds)' : heroPL() < foeLv() ? ' (behind: study more!)' : ' (even)'}.</p><div class="paths">${S.paths.map((pth,i)=>`<button class="path s${pth.stars} ${pth.kind}" data-i="${i}"><span class="st">${pth.kind==='event'?'? Event':stars(pth.stars)}</span><b>${esc(dungeonName(S.world, pth))}</b><small>${desc(pth)}</small></button>`).join('')}</div>

  $('worlds').onclick = () => go('title');
}
function statsHTML(){ const d = C.derive(P()); return `<div class="statgrid">${Object.keys(STATS).map(k=>`<div class="stat"><div><b>${k} ${S.st[k]}${d.s[k]!==S.st[k]?` <span class="up">(+${d.s[k]-S.st[k]})</span>`:''}</b><small>${STATS[k]}</small></div><button class="plus" data-k="${k}" ${S.pts?'':'disabled'} aria-label="add a point to ${k}">+1</button></div>`).join('')}</div>
  <p class="muted">Max HP ${d.max} · dodge ${Math.round(d.dodge*100)}% · crit ${Math.round(d.crit*100)}% · damage ×${d.mult.toFixed(2)} · speed ${d.speed.toFixed(1)}</p>`; }
function wireStats(root){ root.querySelectorAll('.plus').forEach(b => b.onclick = () => { if (!S.pts) return; const before = maxHP(); S.st[b.dataset.k]++; S.pts--; if (b.dataset.k==='FOR') S.hp = curHP() + (maxHP() - before); SND.sfx('level'); save(); draw(); }); }

const ACH = [
  ['first','First Steps','Pass your first quest', s => s.stats.quests >= 1],
  ['ten','Diligent','Pass 10 quests', s => s.stats.quests >= 10],
  ['fifty','Scholar of the Camp','Pass 50 quests', s => s.stats.quests >= 50],
  ['hundred','Living Essay','Pass 100 quests', s => s.stats.quests >= 100],
  ['perf5','Flawless','Get 5 perfect scores', s => s.stats.perfects >= 5],
  ['perf25','Word Perfect','Get 25 perfect scores', s => s.stats.perfects >= 25],
  ['quote10','Quote Master','10 perfect quote quests', s => s.stats.quotePerf >= 10],
  ['hour','One Hour In','Study for an hour in total', s => s.stats.time >= 3600],
  ['five','Five Hours Deep','Study for five hours', s => s.stats.time >= 18000],
  ['streak3','On Fire','3-day streak', s => (s.daily||{}).streak >= 3],
  ['streak7','Unstoppable','7-day streak', s => (s.daily||{}).streak >= 7],
  ['boss1','Telescreen Breaker','Defeat a Greenlands world boss', s => WD[0].bossKeys.some(b => s.stats.bosses.includes(b))],
  ['boss2','Breaker of Staffs','Defeat a Storm Coast world boss', s => WD[1].bossKeys.some(b => s.stats.bosses.includes(b))],
  ['boss3','Light in the Shadow','Defeat a Hollow Wastes world boss', s => WD[2].bossKeys.some(b => s.stats.bosses.includes(b))],
  ['boss4','Truly Named','Defeat an Icelands world boss', s => WD[3].bossKeys.some(b => s.stats.bosses.includes(b))],
  ['hunter','Monster Hunter','Defeat 100 enemies', s => Object.values(s.stats.kills).reduce((a,b)=>a+b,0) >= 100],
  ['legend','Legendary','Find a Legendary item', s => Object.values(s.stats.found).some(r => r >= 3)],
  ['myth','Myth Made Real','Find a Mythical item', s => Object.values(s.stats.found).some(r => r >= 4)],
  ['codex','Master of the Codex','Fill one paragraph’s Codex to ●●●●●', s => Object.values(s.mastery).some(m => m.pass - m.fail >= 5)]];
function noteFind(it){ if (!it || !S || !S.stats) return; if (it.name && it.kind !== 'consumable') S.stats.found[it.name] = Math.max(S.stats.found[it.name]||0, it.rar||0); if (it.myth){ S.stats.myth = S.stats.myth || {}; S.stats.myth[it.myth] = Math.max(S.stats.myth[it.myth]||0, (it.world||0)+1); } }
function legendBanner(loot){ const L = (loot||[]).filter(i => i.myth || i.special).sort((a,b)=>b.rar-a.rar)[0]; if (!L) return ''; return `<div class="legend-banner r${L.rar}"><span>${L.rar===6?'OUTERVERSAL RELIC':L.rar===5?'PROMISED RELIC':L.rar===4?'MYTHICAL RELIC':'LEGENDARY RELIC'}</span><b>${esc(L.name)}</b><em>${esc(L.lore||'')}</em></div>`; }
function checkAch(){ if (!S || !S.stats) return; for (const [id, n, d, f] of ACH){ if (!S.stats.ach.includes(id) && f(S)){ S.stats.ach.push(id); S.meta.wisdom += 10; toast(`🏆 Achievement: ${n} (+10 Wisdom) · title unlocked`); if (!S.stats.title) S.stats.title = n; } } save(); }

function journalHTML(){ const st = S.stats; const units = unitsOf(S.world); const allKeys = WD.flatMap(w => [...w.enemies, ...(Array.isArray(w.mini)?w.mini:[w.mini]), ...(w.bossKeys || [w.bossKey])]);
